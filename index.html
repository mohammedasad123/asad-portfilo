<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR GARDEN Function Hall Booking maddur siddipet</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 400px;
            margin: 50px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
            text-align: center;
        }

        h1 {
            color: darkred;
            margin-bottom: 20px;
        }

        input, select {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid gray;
            border-radius: 5px;
        }

        button {
            background: darkred;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            width: 95%;
            font-size: 16px;
        }

        button:hover {
            background: red;
        }

        #result {
            margin-top: 20px;
            color: green;
            font-weight: bold;
        }

        footer {
            margin-top: 20px;
            color: gray;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>AR GARDEN  Function Hall maddur</h1>

        <form id="bookingForm">

            <input type="text" id="name" placeholder="Enter Customer Name" required>

            <select id="event">
                <option>Wedding</option>
                <option>Birthday</option>
                <option>Reception</option>
                <option>Engagement</option>
            </select>

            <input type="date" id="date" required>

            <input type="number" id="guests" placeholder="Enter Number of Guests" required>

            <button type="submit">Book Now</button>

        </form>

        <div id="result"></div>

        <footer>
            Thank you for choosing Ar garden function hall maddur siddipet
        </footer>

    </div>

    <script>
        document.getElementById("bookingForm").addEventListener("submit", function(event) {

            event.preventDefault();

            let name = document.getElementById("name").value;
            let event = document.getElementById("event").value;
            let date = document.getElementById("date").value;
            let guests = document.getElementById("guests").value;

            document.getElementById("result").innerHTML =
                "✅ Booking Confirmed Successfully! <br><br>" +
                "Customer Name : " + name + "<br>" +
                "Event Type : " + event + "<br>" +
                "Booking Date : " + date + "<br>" +
                "Guests : " + guests;
        });
    </script>

</body>
</html>
